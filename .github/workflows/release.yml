name: Release

# oddgames/unity-scripting's release workflow pushes each version tag here; this turns the tag into a GitHub
# release with the DLLs attached. Already-released tags are left alone.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released"; exit 0; fi
          gh release create "$tag" --title "$tag" --verify-tag \
            --notes "Add to Packages/manifest.json: \`\"au.com.oddgames.scripting\": \"https://github.com/${GITHUB_REPOSITORY}.git#${tag}\"\`. See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/CHANGELOG.md)." \
            Runtime/ODDGames.Scripting.dll Runtime/ODDGames.Scripting.xml \
            Runtime/ODDGames.Scripting.Unity.dll Runtime/ODDGames.Scripting.Unity.xml \
            Editor/ODDGames.Scripting.Editor.dll Editor/ODDGames.Scripting.Editor.xml
